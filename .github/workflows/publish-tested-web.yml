name: Publish tested Bondi web release
on:
  push:
    branches: [ops/publish-bondi-tested-web]
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout the deployment script
        uses: actions/checkout@v4
      - name: Validate deployment script syntax
        run: bash -n scripts/publish-tested-web-isolated.sh
      - name: Publish the tested web build and preserve unfinished campaign source
        uses: appleboy/ssh-action@v1.0.3
        env:
          OPS_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: OPS_SHA
          script_stop: true
          command_timeout: 30m
          script: |
            set -eu
            cd /home/pdh/PDH
            git fetch origin "$OPS_SHA"
            git show "$OPS_SHA:scripts/publish-tested-web-isolated.sh" | bash -s
